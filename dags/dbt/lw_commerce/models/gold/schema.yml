version: 2

models:
  - name: daily_revenue
    description: Daily revenue and order counts by country (non-cancelled). UC table gold.daily_revenue.
  - name: top_products
    description: Product ranking by revenue, units, and unique buyers. UC table gold.top_products.
  - name: order_fulfillment
    description: Order status distribution (funnel) by country. UC table gold.order_fulfillment.
  - name: customer_orders
    description: Per-customer LTV proxy, AOV, and primary country. UC table gold.customer_orders.
