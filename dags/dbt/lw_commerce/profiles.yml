# Used for ad-hoc dbt CLI inside the Astro scheduler (`just dbt-run`).
# Cosmos DAGs inject a profile via DatabricksTokenProfileMapping instead.
lw_commerce:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'workspace') }}"
      schema: "{{ env_var('DATABRICKS_SCHEMA', 'bronze') }}"
      threads: 4
